# Nginx server block for curelex.in
# Install: sudo cp deploy/nginx/curelex.conf /etc/nginx/sites-available/curelex.conf
#          sudo ln -s /etc/nginx/sites-available/curelex.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Get certs first with: sudo certbot --nginx -d curelex.in -d www.curelex.in
# (certbot will rewrite the ssl_certificate lines below automatically)

server {
    listen 80;
    listen [::]:80;
    server_name curelex.in www.curelex.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name curelex.in www.curelex.in;

    ssl_certificate     /etc/letsencrypt/live/curelex.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/curelex.in/privkey.pem;

    # Backend accepts up to 20mb JSON bodies + file uploads up to 15mb (documents.js);
    # give headroom for multipart overhead.
    client_max_body_size 25m;

    root /var/www/curelex/hms-react/dist;
    index index.html;

    # Socket.IO — must be matched before the SPA fallback below, and needs the
    # Upgrade/Connection headers forwarded or it silently degrades to polling-only.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded documents/images, served by the backend via express.static
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # React Router SPA fallback — must be last
    location / {
        try_files $uri /index.html;
    }
}
